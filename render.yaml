# Render Blueprint: creates the API and a managed PostgreSQL database.
# Secrets marked sync:false are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: researchhub-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: researchhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGINS
        sync: false        # e.g. https://researchhub.example.com
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: researchhub-db
    plan: free
    ipAllowList: []        # empty = reachable only from your Render services
